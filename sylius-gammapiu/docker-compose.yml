services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gammapiu_sylius_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/sylius:rw
      - ./public/media:/var/www/sylius/public/media:rw
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: 3a9284f291bb4c00b3952a8d11c79e8a
      DATABASE_URL: mysql://sylius:sylius_pass@mysql:3306/sylius_gammapiu?serverVersion=8.0.32&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sylius_network

  nginx:
    image: nginx:1.25-alpine
    container_name: gammapiu_sylius_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/sylius:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - sylius_network

  mysql:
    image: mysql:8.0
    container_name: gammapiu_sylius_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "33060:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sylius_gammapiu
      MYSQL_USER: sylius
      MYSQL_PASSWORD: sylius_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sylius_network

  redis:
    image: redis:7-alpine
    container_name: gammapiu_sylius_redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    networks:
      - sylius_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: gammapiu_sylius_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - sylius_network

volumes:
  mysql_data:

networks:
  sylius_network:
    driver: bridge
